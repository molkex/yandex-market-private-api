[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-market-private-api"
version = "0.2.0"
description = "Unofficial Yandex Market Private API & SDUI Engine for Python (Zero-Device, Pure-HTTP, iOS & Android)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Maksim Tkachuk", email = "maksim@tkachuk.im"}
]
keywords = [
    "yandex-market",
    "private-api",
    "fapi",
    "divkit",
    "sdui",
    "headless",
    "ecommerce",
    "scraper",
    "crawler",
    "reverse-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = []

[project.optional-dependencies]
fast = [
    "brotli>=1.0.9",
    "curl_cffi>=0.7.0"
]
crypto = [
    "cryptography>=41.0.0"
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]
full = [
    "brotli>=1.0.9",
    "curl_cffi>=0.7.0",
    "cryptography>=41.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]

[project.scripts]
openyamarket = "openyamarket.__main__:main"

[project.urls]
Homepage = "https://github.com/molkex/yandex-market-private-api"
Repository = "https://github.com/molkex/yandex-market-private-api"
Issues = "https://github.com/molkex/yandex-market-private-api/issues"
Telegram = "https://t.me/mxmtkchk"
